[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "largegraph"
dynamic = ["version"]
description = "A local CPU-only workbench for exploring graphs larger than RAM"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "largegraph contributors"}]
keywords = ["graph", "visualization", "out-of-core", "community-detection", "network-analysis"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: POSIX :: Linux",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
  "numpy>=2.5.4,<3", "duckdb>=1.5.6,<2", "pyarrow>=24.0.0,<25",
  "igraph>=1.0.0,<2", "numba>=0.68.1,<1", "psutil>=7.2.2,<8",
]

[project.optional-dependencies]
images = ["matplotlib>=3.11.2,<4", "scipy>=1.18.1,<2"]
leiden = ["leidenalg>=0.12.0,<1"]
networkit = ["networkit>=11.2.2,<12; sys_platform != 'win32'"]
validation = ["scikit-learn>=1.9.1,<2"]
clustre-build = ["mpich>=5.0.2,<6; sys_platform == 'linux'"]

[dependency-groups]
dev = ["pytest>=9.2.0,<10", "ruff>=0.17.3,<1", "mypy>=2.4.0,<3", "build>=1.6.1,<2", "twine>=7.0.0,<8", "pytest-cov>=7.1.0,<8"]
browser = ["playwright>=1.64.1,<2"]


[project.scripts]
largegraph = "largegraph.cli:main"

[project.urls]
Homepage = "https://github.com/VincenzoImp/LargeGraph"
Repository = "https://github.com/VincenzoImp/LargeGraph"
Documentation = "https://github.com/VincenzoImp/LargeGraph/tree/main/docs"
Issues = "https://github.com/VincenzoImp/LargeGraph/issues"
Changelog = "https://github.com/VincenzoImp/LargeGraph/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = {attr = "largegraph._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
largegraph = ["assets/*.html", "assets/*.csv", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["browser: requires the optional browser dependency group and Chromium"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
files = ["src/largegraph/api.py", "src/largegraph/config.py", "src/largegraph/budget.py"]

[tool.coverage.run]
source = ["largegraph"]

[tool.uv]
required-version = ">=0.11.28"
