[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "largegraph-viz"
dynamic = ["version"]
description = "A local CPU-only workbench for exploring graphs larger than RAM"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "largegraph-viz contributors"}]
keywords = ["graph", "visualization", "out-of-core", "community-detection", "network-analysis"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: POSIX :: Linux",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
  "numpy>=1.26,<3", "duckdb>=1.5.6,<2", "pyarrow>=17,<25",
  "igraph>=0.11,<2", "numba>=0.61,<1", "psutil>=6,<8",
]

[project.optional-dependencies]
images = ["matplotlib>=3.9,<4", "scipy>=1.13,<2"]
leiden = ["leidenalg>=0.10,<1"]
validation = ["scikit-learn>=1.5,<2"]
clustre-build = ["mpich>=4,<6; sys_platform == 'linux'"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "mypy>=1.15,<2", "build>=1.2,<2", "twine>=6,<7", "pytest-cov>=6,<8"]
browser = ["playwright>=1.51,<2"]

[project.scripts]
largegraph-viz = "largegraph_viz.cli:main"

[project.urls]
Homepage = "https://github.com/VincenzoImp/largegraph-viz"
Repository = "https://github.com/VincenzoImp/largegraph-viz"
Documentation = "https://github.com/VincenzoImp/largegraph-viz/tree/main/docs"
Issues = "https://github.com/VincenzoImp/largegraph-viz/issues"
Changelog = "https://github.com/VincenzoImp/largegraph-viz/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = {attr = "largegraph_viz._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
largegraph_viz = ["assets/*.html", "assets/*.csv", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["browser: requires the optional browser dependency group and Chromium"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
files = ["src/largegraph_viz/api.py", "src/largegraph_viz/config.py", "src/largegraph_viz/budget.py"]

[tool.coverage.run]
source = ["largegraph_viz"]

[tool.uv]
required-version = ">=0.11.28"
