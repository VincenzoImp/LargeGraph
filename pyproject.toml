[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "largegraph-viz"
version = "0.1.0"
description = "Reproducible, disk-backed visualization of graphs larger than RAM"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "numpy>=1.26,<3", "duckdb>=1.2,<2", "pyarrow>=17,<25",
  "matplotlib>=3.9,<4", "scipy>=1.13,<2", "igraph>=0.11,<2",
  "leidenalg>=0.10,<1", "numba>=0.61,<1", "psutil>=6,<8",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "scikit-learn>=1.5,<2"]

[project.scripts]
largegraph-viz = "largegraph_viz.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
